name: inbox
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: inbox
  cancel-in-progress: false

permissions:
  contents: write
  issues: write       # v3.2 sec.2: lint blocked-issues

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # v3.2 fix: git identity BEFORE any script that commits internally
      # (backlog one() lock/cycle commits) — without it every runner cycle
      # "lost the push mutex" and executed nothing while staying green.
      - name: git identity
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # v3.2 sec.2: silent-death guard — failure opens a "blocked" issue and halts the cycle
      - name: "yaml lint (silent-death guard, v3.2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lint_workflows.py

      - name: sweep mail.tm inboxes + complete verification links
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python scripts/mailtm.py verify --all || true

      - name: commit state
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          python scripts/backlog.py --commit "auto: inbox $(date -u +%FT%TZ)"
