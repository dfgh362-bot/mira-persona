name: inbox
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: inbox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: sweep mail.tm inboxes + complete verification links
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python scripts/mailtm.py verify --all || true

      - name: commit state
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          python scripts/backlog.py --commit "auto: inbox $(date -u +%FT%TZ)"
