name: keepalive
on:
  schedule:
    - cron: "0 */6 * * *"   # v3.2 sec.3: the cron watchdog checks 4x/day
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # v3.2 sec.3: list/enable workflows via the API
  issues: write       # v3.2 sec.3: open "blocked" issues on 24h stalls

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # v3.2 sec.2: the lint runs here too (opens the blocked issue), but
      # the watchdog layer must survive dead layers — it does NOT halt.
      - name: "yaml lint (watchdog exception, v3.2)"
        run: python scripts/lint_workflows.py || echo "lint blocked (issue opened) — watchdog continues"

      # v3.2 sec.3: the real watchdog is cron (external). verify every
      # workflow's last run via the API, re-enable disabled schedules,
      # open a "blocked" issue if any workflow has 0 runs in 24h, write
      # the dependency chain into HEALTH.md.
      - name: watchdog (v3.2 sec.3)
        run: python scripts/keepalive.py

      - name: archive old items
        run: python scripts/state.py archive --older-than 48h || true

      - name: commit
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          python scripts/backlog.py --commit "auto: keepalive $(date -u +%FT%TZ)"
