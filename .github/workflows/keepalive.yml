name: keepalive
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: archive old items + heartbeat
        run: python scripts/state.py archive --older-than 48h

      - name: commit
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "auto: keepalive $(date -u +%FT%TZ)"
          git push
