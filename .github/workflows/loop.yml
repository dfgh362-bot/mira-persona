name: loop
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write        # v4 immune system: command channel + deadman + thrash notices

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # v3.1 R-06: pull/rebase needs real history

      - name: stop check
        id: stop
        run: |
          if [ -f state/STOP ]; then
            echo "halt=true" >> "$GITHUB_OUTPUT"
            echo "state/STOP present — halting (delete the file to resume)"
          else
            echo "halt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cooldown check (loop.lock fresher than 4 min -> idle)
        id: cool
        if: steps.stop.outputs.halt == 'false'
        run: |
          if python3 scripts/backlog.py --check-lock; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "lock fresh — another runner is active, idling"
          fi

      # v3.2 fix: git identity BEFORE any script that commits internally
      # (backlog one() lock/cycle commits) — without it every runner cycle
      # "lost the push mutex" and executed nothing while staying green.
      - name: git identity
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        if: steps.stop.outputs.halt == 'false'
        with:
          python-version: "3.11"

      # v3.2 sec.2: yaml lint at the TOP of every cycle, before anything
      # else — a silent-death class must never recur silently. Runs even
      # when the lock is fresh (idling cycles still lint). Failure opens a
      # "blocked" issue and halts the cycle (red step, rest skipped).
      - name: "yaml lint (silent-death guard, v3.2)"
        if: steps.stop.outputs.halt == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lint_workflows.py

      # v3.5 sec.4: browser-lane ceremony items (wire <p> + first post) run
      # post_*.py browser wrappers inside one() — chromium cached, not
      # redownloaded every 5-min cycle
      - name: cache chromium (v3.5 sec.4)
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.57

      - name: install playwright + stealth (v3.5 sec.4)
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        run: |
          python -m pip install --quiet playwright playwright-stealth pynacl
          python -m playwright install chromium --with-deps || python -m playwright install chromium

      - name: "one backlog item (v4+v3.2 immune wired in)"
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIRE_PAT: ${{ secrets.GH_PAT }}
          MAIL_ADDR: ${{ secrets.MAIL_ADDR }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          COOKIES_X: ${{ secrets.COOKIES_X }}
          COOKIES_REDDIT: ${{ secrets.COOKIES_REDDIT }}
          COOKIES_PINTEREST: ${{ secrets.COOKIES_PINTEREST }}
          COOKIES_FANVUE: ${{ secrets.COOKIES_FANVUE }}
          COOKIES_INSTAGRAM: ${{ secrets.COOKIES_INSTAGRAM }}
          COOKIES_TIKTOK: ${{ secrets.COOKIES_TIKTOK }}
        run: python scripts/backlog.py --one

      - name: brain (skipped while PAUSEd)
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        run: |
          if [ ! -f state/PAUSE ]; then python scripts/brain.py || true; fi

      - name: site (skipped while PAUSEd)
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        run: |
          if [ ! -f state/PAUSE ]; then python scripts/build_site.py || true; fi

      - name: heartbeat bump (before commit so it lands remotely)
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        run: |
          python3 -c "import json,os,datetime; p='state/HEARTBEAT'; d=json.load(open(p)) if os.path.exists(p) else {'cycle':0}; d['ts']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'); open(p,'w').write(json.dumps(d))"

      - name: commit + push (skipped while PAUSEd; one() commits pause heartbeats)
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          if [ ! -f state/PAUSE ]; then
            python scripts/backlog.py --commit "auto: loop cycle $(date -u +%FT%TZ)"
          fi

      - name: "self-dispatch (heartbeat, R-08 GITHUB_TOKEN + actions:write)"
        if: steps.stop.outputs.halt == 'false' && steps.cool.outputs.proceed == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/loop.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "self-dispatch http $code (cron */5 is the backstop)"
