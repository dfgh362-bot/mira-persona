name: generate
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: images (4 free + 2 paid per run = 8/4 per day)
        run: |
          python scripts/gen_image.py --tier free --count 4
          python scripts/gen_image.py --tier paid --count 2

      - name: captions
        run: python scripts/gen_caption.py

      - name: video (1 per run = 2 per day)
        run: python scripts/make_video.py --auto

      - name: voice notes
        run: |
          pip install --quiet edge-tts
          python scripts/gen_voice.py

      - name: site
        run: python scripts/build_site.py

      - name: commit state
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "auto: generate $(date -u +%F)"
          git push

  pages:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
