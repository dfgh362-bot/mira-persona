name: generate
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write
  issues: write       # v3.2 sec.2: lint blocked-issues

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # v3.2 fix: git identity BEFORE any script that commits internally
      # (backlog one() lock/cycle commits) — without it every runner cycle
      # "lost the push mutex" and executed nothing while staying green.
      - name: git identity
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # v3.1 R-07: idempotent dep step — install only when missing
      - name: deps (idempotent)
        run: command -v ffmpeg || sudo apt-get install -y ffmpeg

      # v3.2 sec.2: silent-death guard — failure opens a "blocked" issue and halts the cycle
      - name: "yaml lint (silent-death guard, v3.2)"
        run: python scripts/lint_workflows.py

      - name: images (4 free + 2 paid per run = 8/4 per day)
        run: |
          python scripts/gen_image.py --tier free --count 4 || true
          python scripts/gen_image.py --tier paid --count 2 || true

      - name: captions
        run: python scripts/gen_caption.py || true

      - name: video (1 per run = 2 per day)
        run: python scripts/make_video.py --auto || true

      - name: voice notes
        run: |
          pip install --quiet edge-tts
          python scripts/gen_voice.py || true

      - name: "site (R-03 syncs content/free into site/content for same-origin tier)"
        run: python scripts/build_site.py || true

      # v3.1 R-03: artifact packaged HERE (after build) so the untracked
      # site/content/ mirror ships to Pages.
      - name: package pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: commit state
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          python scripts/backlog.py --commit "auto: generate $(date -u +%FT%TZ)"

  pages:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
