name: post
on:
  schedule:
    - cron: "0 9,13,17,21 * * *"
  workflow_dispatch:

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write
  issues: write       # v3.2 sec.2 lint blocked-issues + v3.5 sec.3 cookie-expired issues

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # v3.2 fix: git identity BEFORE any script that commits internally
      # (backlog one() lock/cycle commits) — without it every runner cycle
      # "lost the push mutex" and executed nothing while staying green.
      - name: git identity
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # v3.2 sec.2: silent-death guard — failure opens a "blocked" issue and halts the cycle
      - name: "yaml lint (silent-death guard, v3.2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lint_workflows.py

      # v3.5 sec.4: browser lane needs chromium — cached, never redownload 150MB per run
      - name: cache chromium (v3.5 sec.4)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.57

      - name: install playwright + stealth (v3.5 sec.4)
        run: |
          python -m pip install --quiet playwright playwright-stealth pynacl
          python -m playwright install chromium --with-deps || python -m playwright install chromium

      # v3.5 sec.3: cookie health BEFORE any posting — logged-out ->
      # status cookie_expired + ONE blocked issue + skip this cycle
      - name: "cookie health (v3.5 sec.3)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIRE_PAT: ${{ secrets.GH_PAT }}
          COOKIES_X: ${{ secrets.COOKIES_X }}
          COOKIES_REDDIT: ${{ secrets.COOKIES_REDDIT }}
          COOKIES_PINTEREST: ${{ secrets.COOKIES_PINTEREST }}
          COOKIES_FANVUE: ${{ secrets.COOKIES_FANVUE }}
        run: python scripts/cookie_health.py || true

      # v3.5 sec.1: api lane ONLY — browser platforms' api posters are
      # disabled (no double posting)
      - name: post to api-lane tier-1 platforms (v3.5)
        env:
          GH_USER: ${{ github.repository_owner }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: |
          for p in bluesky telegram mastodon; do
            echo "::group::post_$p"
            python scripts/post_$p.py || true
            echo "::endgroup::"
          done

      # v3.5 sec.1/7: browser lane — Playwright + storageState vault,
      # stealth, 400-1200ms human delays, post read back off the profile
      - name: post to browser-lane tier-1 platforms (v3.5)
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIRE_PAT: ${{ secrets.GH_PAT }}
          COOKIES_X: ${{ secrets.COOKIES_X }}
          COOKIES_REDDIT: ${{ secrets.COOKIES_REDDIT }}
          COOKIES_PINTEREST: ${{ secrets.COOKIES_PINTEREST }}
        run: |
          for p in x reddit pinterest; do
            echo "::group::browser_$p"
            python scripts/browserpost.py --platform $p || true
            echo "::endgroup::"
          done

      - name: fanvue (tier 3 browser lane, v3.5 sec.8)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIRE_PAT: ${{ secrets.GH_PAT }}
          COOKIES_FANVUE: ${{ secrets.COOKIES_FANVUE }}
        run: python scripts/browserpost.py --platform fanvue || true

      - name: commit state
        run: |
          git config user.name "mira-bot"
          git config user.email "mira-bot@users.noreply.github.com"
          python scripts/backlog.py --commit "auto: post $(date -u +%FT%TZ)"
